name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    if: ${{ hashFiles('go.mod') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -shuffle=on -coverprofile=cover.out ./...
      - uses: golangci/golangci-lint-action@v9

  web:
    if: ${{ hashFiles('web/package.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web exec biome check .
      - run: pnpm -C web test --run
      - run: pnpm -C web build

  skills:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: node --test skills/scripts.test.mjs

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: requirement IDs are unique
        run: |
          dups=$(grep -oE '^\*\*[A-Z]+-[0-9]+' docs/requirements.md | sort | uniq -d)
          if [ -n "$dups" ]; then echo "duplicate requirement IDs: $dups"; exit 1; fi
      - name: no filler words in docs or UI text (UI-5)
        run: |
          words='seamless|effortless|powerful|unlock|supercharge|leverage|revolutioni[sz]e|AI-powered|elevate'
          if grep -rniEw "$words" README.md AGENTS.md docs/*.md docs/mockups/*.js docs/mockups/*.html web/src 2>/dev/null | grep -v 'docs/requirements.md'; then
            echo "remove the words above (UI-5)"; exit 1
          fi
