name: ci

# Pull requests run this directly; pushes to main run it as the first job of
# release.yml, so main is checked once and released only when green.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Latest patch of the go.mod minor: patch releases carry stdlib security fixes,
# and go.mod's `go 1.26.0` alone would build with 1.26.0 forever.
env:
  GO_VERSION: "1.26.x"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Workflow files are code too: a broken one shows up as a red run with no jobs.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # A pinned module version, checked against the Go checksum database.
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.9 -color

  # NFR-4: the same Go suite on every OS we ship. It includes the installer
  # tests (scripts/), which run install.sh / install.ps1 against a local fake
  # release on each OS.
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: go vet ./...
      - run: go test -race -shuffle=on ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: go test -coverprofile=cover.out ./internal/...
      - name: coverage summary
        shell: bash
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/{print $3}')
          echo "### Coverage of internal/: $total" >> "$GITHUB_STEP_SUMMARY"
          echo "coverage $total"

  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web exec biome check .
      - run: pnpm -C web test --run
      - run: pnpm -C web build

  skills:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 18
      - run: node --test skills/scripts.test.mjs

  # The release pipeline, end to end, without publishing (NFR-1, NFR-5, NFR-7).
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: check the built artifacts
        run: go run ./tools/checkdist dist
      - name: known vulnerabilities in the shipped binary (stdlib included)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -mode=binary dist/mcpdeck_linux_amd64_v1/mcpdeck

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The action needs Settings › Code security › Dependency graph. While it's
      # off the API answers 403; skip with a notice instead of a red check.
      - id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE}...${HEAD}" >/dev/null 2>err.txt; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 403' err.txt; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dependency graph is off (Settings › Code security). Dependency review skipped."
          else
            cat err.txt; exit 1
          fi
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        if: steps.graph.outputs.enabled == 'true'
        with:
          fail-on-severity: high

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: requirement IDs are unique
        run: |
          dups=$(grep -oE '^\*\*[A-Z]+-[0-9]+' docs/requirements.md | sort | uniq -d)
          if [ -n "$dups" ]; then echo "duplicate requirement IDs: $dups"; exit 1; fi
      - name: no filler words in docs or UI text (UI-5)
        run: |
          words='seamless|effortless|powerful|unlock|supercharge|leverage|revolutioni[sz]e|AI-powered|elevate'
          if grep -rniEw "$words" README.md AGENTS.md docs/*.md docs/mockups/*.js docs/mockups/*.html web/src site 2>/dev/null | grep -v 'docs/requirements.md'; then
            echo "remove the words above (UI-5)"; exit 1
          fi
