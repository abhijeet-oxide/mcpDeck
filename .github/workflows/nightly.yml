name: nightly

# The full scenario suite with the race detector on Linux and macOS, every
# night and on demand. Pull requests run it without -race in ci.yml.
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"

jobs:
  scenarios:
    name: scenarios (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: scenarios with -race
        working-directory: e2e/scenarios
        run: go test -race -count=1 -timeout 25m -args -report "$GITHUB_WORKSPACE/scenarios.json"
      - name: report
        if: always()
        run: go run ./tools/scenarioreport scenarios.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scenarios-${{ matrix.os }}
          path: scenarios.json
          if-no-files-found: ignore
