# Release configuration (NFR-5, NFR-7, NFR-8). See docs/releasing.md.
# Dry run locally: goreleaser release --snapshot --clean --skip=publish
version: 2
project_name: mcpdeck

before:
  hooks:
    - pnpm -C web install --frozen-lockfile
    - pnpm -C web build

builds:
  - id: mcpdeck
    main: ./cmd/mcpdeck
    binary: mcpdeck
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/abhijeet-oxide/mcpdeck/internal/version.Version={{ .Version }}
      - -X github.com/abhijeet-oxide/mcpdeck/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/abhijeet-oxide/mcpdeck/internal/version.Date={{ .CommitDate }}
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

# Names carry no version so releases/latest/download/<name> is a stable URL.
archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
  # The bare binary: download and run, nothing to unpack.
  - id: binary
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: scripts/install.sh
    - glob: scripts/install.ps1

sboms:
  - artifacts: archive
    ids: [default]

changelog:
  use: git
  sort: asc
  groups:
    - title: Breaking changes
      regexp: '^.*?\w+(\(.+\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\(.+\))?:.+$'
      order: 1
    - title: Fixes
      regexp: '^.*?(fix|perf)(\(.+\))?:.+$'
      order: 2
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"
      - "^ci"
      - "^build"
      - "^style"
      - "^refactor"
      - "^Merge "

release:
  draft: false
  prerelease: auto
  extra_files:
    - glob: scripts/install.sh
    - glob: scripts/install.ps1
  header: |
    ## Install

    **Windows** (PowerShell):
    ```powershell
    irm https://github.com/abhijeet-oxide/mcpDeck/releases/download/{{ .Tag }}/install.ps1 | iex
    ```

    **macOS / Linux**:
    ```sh
    curl -fsSL https://github.com/abhijeet-oxide/mcpDeck/releases/download/{{ .Tag }}/install.sh | sh
    ```

    Or download the binary for your platform below and run it: `mcpdeck_windows_amd64.exe`, `mcpdeck_darwin_arm64`, `mcpdeck_linux_amd64`…
    Verify any file with `gh attestation verify <file> --repo abhijeet-oxide/mcpDeck`.
  footer: |
    {{ if .PreviousTag }}**Full changelog**: https://github.com/abhijeet-oxide/mcpDeck/compare/{{ .PreviousTag }}...{{ .Tag }}{{ end }}
